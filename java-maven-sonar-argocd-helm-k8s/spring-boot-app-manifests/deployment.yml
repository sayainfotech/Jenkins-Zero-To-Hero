apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-apps
  labels:
    app: spring-boot-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
    spec:
      containers:
      - name: spring-boot-app
        image: abhisheksaya5/first-cicd:5
        ports:
        - containerPort: 8080
